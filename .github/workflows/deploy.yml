name: Deploy to Cloud Run

on:
  release:
    types: [published]

env:
  GCP_REGION: us-central1
  SERVICE_NAME: agentdialog-api
  REPO: agentdialog

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build Docker image
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE_NAME }}"
          docker build -f Dockerfile.cloudrun -t "${IMAGE}:${{ github.event.release.tag_name }}" -t "${IMAGE}:latest" .
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Push to Artifact Registry
        run: |
          docker push "${IMAGE}:${{ github.event.release.tag_name }}"
          docker push "${IMAGE}:latest"

      - name: Run database migrations
        run: |
          docker run --rm \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            -e SESSION_SECRET="ci-migration-only-not-a-real-secret" \
            "${IMAGE}:${{ github.event.release.tag_name }}" \
            bun run db:migrate

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.IMAGE }}:${{ github.event.release.tag_name }}
          flags: |
            --port=8080
            --cpu=1
            --memory=512Mi
            --min-instances=1
            --max-instances=10
            --timeout=300
            --concurrency=80
            --session-affinity

      - name: Output deployment URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --format="value(status.url)")
          echo "### Deployed ${{ github.event.release.tag_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${URL}" >> "$GITHUB_STEP_SUMMARY"
