name: Publish SDK to npm

on:
  push:
    tags:
      - "sdk-v*"

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing over OIDC needs npm >= 11.5.1. Node 24 bundles npm 11.x
      # already; pin it explicitly so a runner image change cannot silently regress
      # us to a version that has no OIDC support and fails with ENEEDAUTH.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1

      # Root dependencies here only serve the root unit test step below.
      # An earlier comment claimed the root bun.lock was deliberately not
      # committed. It is committed, and so are web/ and sdks/typescript/, so
      # this install pins like every other one in the repo.
      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test tests/unit

      - name: Install SDK dependencies
        working-directory: sdks/typescript
        run: bun install --frozen-lockfile

      - name: Typecheck SDK
        working-directory: sdks/typescript
        run: bunx tsc --noEmit

      - name: Test SDK
        working-directory: sdks/typescript
        run: bun test tests

      - name: Build SDK
        working-directory: sdks/typescript
        run: bun run build

      # The suite above imports from src/, so it says nothing about the artifact
      # we are one step away from publishing. These two check the built output
      # and then the packed tarball, because an npm version cannot be replaced
      # once it is out — the release has to fail here or not at all.
      - name: Test built output
        working-directory: sdks/typescript
        run: bun test packaged

      - name: Smoke-test the packed tarball
        working-directory: sdks/typescript
        run: bash scripts/smoke-pack.sh

      - name: Publish
        working-directory: sdks/typescript
        run: npm publish --provenance --access public
